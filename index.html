<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Liên Hệ - tangtienthu703@gmail.com</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col justify-between">

    <header class="sticky top-0 z-50 backdrop-blur-md bg-white/80 border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-400 flex items-center justify-center text-white font-bold text-lg shadow-md shadow-brand-500/20">
                    T
                </div>
                <span class="font-bold text-xl tracking-tight text-slate-900">Liên Hệ Trực Tuyến</span>
            </div>
            <nav class="hidden md:flex items-center space-x-8 text-sm font-medium text-slate-600">
                <a href="#" class="hover:text-brand-600 transition-colors">Trang Chủ</a>
                <a href="#contact" class="text-brand-600 font-semibold">Gửi Tin Nhắn</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <section id="contact" class="w-full max-w-3xl bg-white rounded-3xl border border-slate-200/85 shadow-xl shadow-slate-100 p-8 sm:p-12">
            
            <div class="text-center mb-10">
                <span class="inline-block px-3 py-1 text-xs font-semibold uppercase tracking-wider text-brand-600 bg-brand-50 rounded-full mb-3">
                    Kết Nối Nhanh Chóng
                </span>
                <h1 class="text-3xl sm:text-4xl font-bold tracking-tight text-slate-900 mb-3">
                    Gửi Tin Nhắn Cho Tôi
                </h1>
                <p class="text-base text-slate-600">
                    Mọi thắc mắc hoặc lời nhắn của bạn sẽ được gửi trực tiếp đến hộp thư <span class="font-medium text-slate-900">tangtienthu703@gmail.com</span>.
                </p>
            </div>

            <form action="https://api.web3forms.com/submit" method="POST" class="space-y-6">
                
                <!-- Web3Forms Access Key -->
                <input type="hidden" name="access_key" value="8b878fb6-69dd-4b11-b27f-4eea4e00a098">
                <input type="hidden" name="subject" value="Tin nhắn mới từ trang web cá nhân của bạn!">

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div>
                        <label for="name" class="block text-sm font-medium text-slate-700 mb-2">Họ và Tên <span class="text-rose-500">*</span></label>
                        <input type="text" id="name" name="name" required placeholder="Nguyễn Văn A" 
                            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition text-sm">
                    </div>
                    <div>
                        <label for="email" class="block text-sm font-medium text-slate-700 mb-2">Địa Chỉ Email <span class="text-rose-500">*</span></label>
                        <input type="email" id="email" name="email" required placeholder="name@example.com" 
                            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition text-sm">
                    </div>
                </div>

                <div>
                    <label for="message" class="block text-sm font-medium text-slate-700 mb-2">Nội Dung Tin Nhắn <span class="text-rose-500">*</span></label>
                    <textarea id="message" name="message" rows="5" required placeholder="Nhập nội dung bạn muốn trao đổi..." 
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition text-sm resize-none"></textarea>
                </div>

                <!-- Botcheck field -->
                <input type="checkbox" name="botcheck" class="hidden" style="display: none;">

                <div>
                    <button type="submit" 
                        class="w-full py-4 px-6 text-white bg-brand-600 font-semibold rounded-xl hover:bg-brand-700 transition shadow-lg shadow-brand-500/30 flex items-center justify-center space-x-2">
                        <span>Gửi Tin Nhắn Ngay</span>
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    </button>
                </div>
            </form>
        </section>
    </main>

    <footer class="bg-white border-t border-slate-200 py-6 text-center text-sm text-slate-500">
        <div class="max-w-7xl mx-auto px-4">
            <p>&copy; 2026 - Được quản lý bởi tangtienthu703@gmail.com</p>
        </div>
    </footer>

</body>
</html>
